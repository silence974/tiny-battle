<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Battle 312</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Tiny Battle 312</h1>
    <a id="debug-link" class="small-button" href="debug.html" target="_blank" rel="noopener">四席视角 / 调试</a>
  </header>
  <main>
    <section class="card" id="entry">
      <div class="mode-switch">
        <button id="host-mode" type="button">我是主机</button>
        <button id="player-mode" type="button">我是玩家</button>
      </div>
      <div id="host-panel">
        <label>主机名称 <input id="host-name" value="Host" autocomplete="nickname"></label>
        <button id="create-room" type="button">创建房间</button>
        <p>主机保持在线，负责运行唯一裁判。</p>
      </div>
      <div id="player-panel" hidden>
        <label>玩家名称 <input id="player-name" value="Player" autocomplete="nickname"></label>
        <label>座位链接 <input id="player-link" placeholder="粘贴四个座位链接之一"></label>
        <button id="join-room" type="button">加入房间</button>
      </div>
      <p id="status" class="status">尚未连接</p>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section class="card" id="room-panel" hidden>
      <div class="room-meta"><span>房间</span> <code id="room-code">—</code> <button id="advance-phase" type="button" hidden>主机推进阶段</button></div>
      <div id="seat-links" class="seat-links"></div>
      <div id="roster" class="roster"></div>
    </section>

    <section class="card game" id="game-panel" hidden>
      <div class="summary">
        <span>阶段 <strong id="phase">—</strong></span>
        <span>回合 <strong id="round">—</strong></span>
        <span>序号 <strong id="sequence">—</strong></span>
      </div>
      <div id="board" class="board" aria-label="board"></div>
      <div class="columns">
        <section><h2>资源</h2><pre id="resources">—</pre></section>
        <section><h2>手牌</h2><pre id="hand">—</pre></section>
        <section><h2>行动</h2><div id="legal-actions" class="actions"></div></section>
      </div>
      <h2>事件</h2><pre id="event-log">—</pre>
      <div id="outcome" class="outcome"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="config-312.js"></script>
  <script src="engine312.js"></script>
  <script src="supabase-room.js"></script>
  <script src="agent-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
