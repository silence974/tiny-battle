<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MESH / VOTE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>四人投票</h1>
      <div class="statusbar">
        <span id="role">尚未加入</span>
        <span>房间 <strong id="room">—</strong></span>
        <span id="status" data-tone="">等待开始</span>
      </div>
    </header>

    <section class="grid setup-grid">
      <article id="host-card" class="card">
        <h2>创建房间</h2>
        <p>房主只负责协调建连，不占玩家席位。</p>
        <button id="start-host" class="primary">创建房间</button>
        <div id="host-panel" hidden>
          <h3>设置玩家昵称</h3>
          <p>先设置四个席位的昵称，再生成一次性邀请链接。</p>
          <div id="host-names" class="stack">
            <label for="seat-name-1">席位 A</label>
            <input id="seat-name-1" value="A" maxlength="20">
            <label for="seat-name-2">席位 B</label>
            <input id="seat-name-2" value="B" maxlength="20">
            <label for="seat-name-3">席位 C</label>
            <input id="seat-name-3" value="C" maxlength="20">
            <label for="seat-name-4">席位 D</label>
            <input id="seat-name-4" value="D" maxlength="20">
          </div>
          <button id="generate-invites" class="primary" disabled>生成 4 个玩家链接</button>
          <div id="invite-panel" hidden>
            <h3>玩家链接</h3>
            <div id="invite-list" class="stack"></div>
          </div>
          <p id="host-waiting" class="hint">正在连接信令服务。</p>
        </div>
      </article>

      <article id="player-card" class="card" hidden>
        <h2>玩家席位</h2>
        <p id="player-seat-label">正在读取邀请链接。</p>
        <div id="player-panel" hidden>
          <p id="player-waiting" class="hint">正在自动加入席位。</p>
        </div>
      </article>
    </section>

    <section id="game-panel" class="grid game-grid" hidden>
      <article class="card vote-card">
        <h2>投票</h2>
        <div class="vote-buttons">
          <button id="vote-a" class="choice-a" disabled>A 阵营</button>
          <button id="vote-b" class="choice-b" disabled>B 阵营</button>
        </div>
        <div id="result" class="result">等待玩家连接。</div>
      </article>
      <aside class="card telemetry">
        <p id="topology" class="topology">连接 0/0</p>
        <ul id="roster" class="roster"></ul>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="game.js"></script>
  <script src="signaling.js"></script>
  <script src="app.js"></script>
</body>
</html>
