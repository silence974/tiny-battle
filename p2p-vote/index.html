<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MESH / VOTE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>四人投票</h1>
      <div class="statusbar">
        <span id="role">尚未加入</span>
        <span>房间 <strong id="room">—</strong></span>
        <span id="status" data-tone="">等待开始</span>
      </div>
    </header>

    <section class="grid setup-grid">
      <article class="card">
        <h2>主机</h2>
        <button id="start-host" class="primary">生成 4 个邀请</button>
        <div id="host-panel" hidden>
          <h3>邀请</h3>
          <div id="invite-list" class="stack"></div>
          <label for="answer-input">玩家 answer</label>
          <textarea id="answer-input" rows="3" placeholder="粘贴 answer 链接"></textarea>
          <button id="import-answer">导入</button>
        </div>
      </article>

      <article class="card">
        <h2>玩家</h2>
        <label for="player-name">昵称</label>
        <input id="player-name" placeholder="玩家名称" maxlength="20">
        <label for="player-invite">邀请链接</label>
        <textarea id="player-invite" rows="3" placeholder="粘贴邀请链接"></textarea>
        <button id="join-game" class="primary">生成 answer</button>
        <div id="player-panel" hidden>
          <label for="answer-link">回传给主机</label>
          <textarea id="answer-link" rows="3" readonly></textarea>
          <button id="copy-answer">复制</button>
          <p id="answer-box" class="hint" hidden>等待连接</p>
        </div>
      </article>
    </section>

    <section id="game-panel" class="grid game-grid" hidden>
      <article class="card vote-card">
        <h2>投票</h2>
        <div class="vote-buttons">
          <button id="vote-a" class="choice-a" disabled>A 阵营</button>
          <button id="vote-b" class="choice-b" disabled>B 阵营</button>
        </div>
        <div id="result" class="result">等待玩家连接。</div>
      </article>
      <aside class="card telemetry">
        <p id="topology" class="topology">连接 0/0</p>
        <ul id="roster" class="roster"></ul>
      </aside>
    </section>
  </main>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
