<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MESH / VOTE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>四人投票</h1>
      <div class="statusbar">
        <span id="role">尚未加入</span>
        <span>房间 <strong id="room">—</strong></span>
        <span id="status" data-tone="">等待开始</span>
      </div>
    </header>

    <section class="grid setup-grid">
      <article id="host-card" class="card">
        <h2>创建房间</h2>
        <p>房主只负责协调建连，不占玩家席位。</p>
        <button id="start-host" class="primary">创建房间</button>
        <div id="host-panel" hidden>
          <h3>房间码</h3>
          <p>把这个房间码发给四位玩家：</p>
          <strong id="host-room-code" class="room-code">—</strong>
          <p id="host-waiting" class="hint">等待玩家加入。</p>
        </div>
      </article>

      <article id="player-card" class="card">
        <h2>玩家</h2>
        <label for="player-name">昵称</label>
        <input id="player-name" placeholder="玩家名称" maxlength="20">
        <label for="room-code">房间码</label>
        <input id="room-code" placeholder="输入 8 位房间码" maxlength="16" autocomplete="off">
        <button id="join-room" class="primary">加入房间</button>
        <div id="player-panel" hidden>
          <p id="player-waiting" class="hint">正在等待主机完成连接。</p>
        </div>
      </article>
    </section>

    <section id="game-panel" class="grid game-grid" hidden>
      <article class="card vote-card">
        <h2>投票</h2>
        <div class="vote-buttons">
          <button id="vote-a" class="choice-a" disabled>A 阵营</button>
          <button id="vote-b" class="choice-b" disabled>B 阵营</button>
        </div>
        <div id="result" class="result">等待玩家连接。</div>
      </article>
      <aside class="card telemetry">
        <p id="topology" class="topology">连接 0/0</p>
        <ul id="roster" class="roster"></ul>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="game.js"></script>
  <script src="signaling.js"></script>
  <script src="app.js"></script>
</body>
</html>
